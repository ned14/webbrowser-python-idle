# Shared reverse-proxy location for the control plane (headscale) — included
# by the CONTROL_PORT listener. Static content:
# no env vars, so it ships as-is (no envsubst).
#
# Catch-all reverse proxy to headscale (its v0.29.x control protocol is
# PATH-LESS: /key, /ts2021 (Noise upgrade), /derp, /bootstrap-dns and the
# legacy /machine/register are all served at the root — the server_url
# carries no path. The embedded-DERP relay URL headscale derives is
# https://${CONTROL_HOST}:${CONTROL_PORT}/derp, which the bare /derp path
# here must match (a trailing-slash location alone would not).
#
# All requests need the same WebSocket handling as /headscale/ (headscale's
# DERP handler answers 426 Upgrade Required and its TS2021 handler answers
# 500 to any non-upgraded request).
location / {
	# Echo the request Origin ONLY when present, and HIDE headscale's
	# own ACAO (it answers /derp/probe with ACAO: *): two
	# Access-Control-Allow-Origin values ("*" + the echoed origin)
	# make the browser reject the wasm client's DERP probe with
	# net::ERR_FAILED (MultipleAllowOriginValues) and the client never
	# finishes its DERP selection.
	proxy_hide_header Access-Control-Allow-Origin;
	if ($http_origin) {
		add_header Access-Control-Allow-Origin $http_origin always;
		add_header Vary Origin always;
	}
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_set_header Host $host;
	proxy_set_header True-Client-IP $remote_addr;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_buffering off;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	proxy_pass http://127.0.0.1:8080;
}
