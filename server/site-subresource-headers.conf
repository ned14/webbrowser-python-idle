# Security headers + cache policy for the immutable, hashed asset locations
# (/cheerpx/, /_app/immutable/) — included from each location because nginx
# does NOT inherit add_header through a location that defines its own, so the
# trio + CSP text live here once instead of being duplicated per location.
# Static content: no env vars, so it ships as-is (no envsubst).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
include /etc/nginx/csp.conf;
add_header Cache-Control "public, max-age=31536000, immutable" always;
