<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>WebVM - Linux virtualization in WebAssembly</title>

		<meta name="description" content="Linux virtual machine, running in the browser via HTML5/WebAssembly. Networking and graphics supported.">
		<meta name="keywords" content="WebVM, Virtual Machine, CheerpX, x86 virtualization, WebAssembly, Tailscale, JIT">
		<meta property="og:title" content="WebVM - Linux virtualization in WebAssembly" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="WebVM"/>
		<meta property="og:image" content="assets/social_2024.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@leaningtech" />
		<meta name="twitter:title" content="WebVM - Linux virtualization in WebAssembly" />
		<meta name="twitter:description" content="Linux virtual machine, running in the browser via HTML5/WebAssembly. Networking and graphics supported.">
		<meta name="twitter:image" content="assets/social_2024.png" />

		<!-- Apple iOS web clip compatibility tags -->
		<meta name="application-name" content="WebVM" />
		<meta name="apple-mobile-web-app-title" content="WebVM" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<link rel="shortcut icon" href="tower.ico">
		<link rel='stylesheet' href='scrollbar.css'>
		<!-- Start the CheerpX runtime download during HTML parse instead of
		     waiting for the app bundle to import it. cx.esm.js is only a
		     605-byte loader; the real weight is cx_esm.js (the ES module the
		     loader imports), cxcore.js (the engine worker) and cxcore.wasm
		     (fetched by the worker). All four are preloaded so the boot path
		     overlaps the fetch of the runtime with the app bundle itself.
		     RELATIVE on purpose: the GitHub Pages deployment lives under
		     /<repo>/, where a root-absolute href would 404 on every load
		     (the dynamic import resolves through siteBase, which equals the
		     document base — so the relative hrefs hit the same URLs). -->
		<link rel="modulepreload" href="cheerpx/cx.esm.js">
		<link rel="modulepreload" href="cheerpx/cx_esm.js">
		<link rel="preload" as="worker" href="cheerpx/cxcore.js">
		<!-- crossorigin (anonymous) matches the worker's plain fetch():
		     same-origin, CORS mode, same-origin credentials — the preload
		     and the real request share one cache entry. -->
		<link rel="preload" as="fetch" href="cheerpx/cxcore.wasm" crossorigin>
		<!-- workerclock.js is fetched by cx_esm.js (plain same-origin fetch,
		     then wrapped into a Worker via a Blob URL) right at engine
		     startup; preloading it overlaps that fetch with the app bundle,
		     exactly like the cxcore.wasm preload above. crossorigin matches
		     the runtime's CORS-mode fetch. -->
		<link rel="preload" as="fetch" href="cheerpx/workerclock.js" crossorigin>
		<!-- Baked networking/sync config (entrypoint-rendered on the server,
		     same-origin): supplies authKey/controlUrl/syncUrl/... so visiting
		     the site root works with NO hash URL. Absent (GitHub Pages) or
		     empty (browser/none mode) it is simply a no-op. Relative on
		     purpose: the GitHub Pages deployment lives under /<repo>/, and a
		     root-absolute src would 404 there on every load. -->
		<script src="./webvm-config.js"></script>
		<script>
			// Move network/sync secrets out of the URL hash into sessionStorage,
			// then strip the hash via history.replaceState so no secrets persist
			// in browser history. This MUST run before the app bundle is
			// evaluated: network.js reads these values at module-import time.
			//
			// Values come from /webvm-config.js (entrypoint-rendered, same-
			// origin) when the URL carries NO hash — visiting the site root
			// auto-wires the tailnet. Any explicit hash is a fully explicit
			// session: the baked config is ignored and only the hash params
			// apply (identical to the pre-baked behavior, so saved `make url`
			// URLs work unchanged). The explicit state is STICKY for the
			// tab's lifetime: a later hash-less navigation/reload never
			// re-arms the baked config (and never overwrites the tab's
			// explicit sessionStorage params).
			(function () {
				var params = null;
				var hash = window.location.hash;
				if (hash && hash.length > 1) params = new URLSearchParams(hash.substring(1));
				var baked = (!params && !sessionStorage.getItem("webvm-explicit-session"))
					? (window.__webvmConfig || {})
					: {};
				// A NEW hash is a complete replacement: stale values from an earlier
				// explicit session in this tab (e.g. a previous #controlUrl)
				// must never merge with a hash that omits them — a credential
				// sent to the wrong control plane would break the tailnet and
				// leak a preauth key. So when a hash is present, clear all
				// five keys first, then set exactly what it provides. A
				// HASH-LESS load (reload of a stripped explicit-session URL,
				// sticky marker set) must NOT clear anything: the tab's
				// explicit sessionStorage params are its session and survive
				// reloads by design.
				["authKey", "controlUrl", "syncUrl", "syncUser", "syncPass"].forEach(function (k) {
					var v = params ? params.get(k) : baked[k];
					if (params) sessionStorage.removeItem(k);
					if (v) sessionStorage.setItem(k, v);
				});
				if (params) {
					sessionStorage.setItem("webvm-explicit-session", "1");
					window.history.replaceState(null, "", window.location.pathname + window.location.search);
				}
			})();
		</script>
		<script>
			// Tailnet boot overlap (tailnet builds only — gated on controlUrl,
			// so browser/none builds pay nothing): warm the control-plane
			// connection with a /health probe at HTML parse (sessionStorage
			// is already seeded above). The tailscale.wasm preload that used
			// to live here was REMOVED (2026-08-30): the wasm client fetches
			// the file with a DIFFERENT credentials mode than a plain link
			// preload, so the preload was never used — on a cold boot the
			// browser downloaded the 32 MB wasm TWICE, competing with the
			// emulated VM boot and delaying the tailnet join past the guest
			// sync agent's wait window (the network-spec regression).
			(function () {
				var controlUrl = sessionStorage.getItem("controlUrl");
				if (!controlUrl) return;
				try {
					fetch(new URL("/health", controlUrl).href,
						{ mode: "no-cors", cache: "no-store" })
						.catch(function () {});
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
