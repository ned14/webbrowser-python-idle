		<script>
			// Move network/sync secrets out of the URL hash into sessionStorage,
			// then strip the hash via history.replaceState so no secrets persist
			// in browser history. This MUST run before the app bundle is
			// evaluated: network.js reads these values at module-import time.
			(function () {
				var hash = window.location.hash;
				if (!hash || hash.length < 2) return;
				var params = new URLSearchParams(hash.substring(1));
				["authKey", "controlUrl", "syncUrl", "syncUser", "syncPass"].forEach(function (k) {
					var v = params.get(k);
					if (v) sessionStorage.setItem(k, v);
				});
				window.history.replaceState(null, "", window.location.pathname + window.location.search);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
