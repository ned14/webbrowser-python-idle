name: webvm-custom

# Options are inline with defaults — `.env` is optional and only overrides.
# Secrets are `${VAR:-}` here (never `${VAR:?err}`) so browser/none builds and
# CI (`docker compose config -q`) pass with nothing set; the entrypoints enforce
# secrets fail-closed per mode.

x-server-env: &server-env
  STORAGE_BACKEND: ${STORAGE_BACKEND:-browser}
  HEADSCALE_ENABLED: ${HEADSCALE_ENABLED:-0}
  HEADSCALE_BOOTSTRAP: ${HEADSCALE_BOOTSTRAP:-0}
  # `make up` sets off: hard-networkless launch — the entrypoint renders an
  # EMPTY page config, skips headscale and all key validation, so the page
  # boots disconnected (sidebar Networking crossed out, zero tailnet
  # attempts) even when .env carries tailnet secrets. `make up-tailnet`
  # sets on (the default).
  WEBVM_TAILNET: ${WEBVM_TAILNET:-on}
  # CONTROL_HOST: the browser-facing control-plane/DERP host (controlUrl in
  # the baked page config, headscale server_url, nginx CSP). Default
  # 127.0.0.1 = zero-config single machine; LAN deployments set it (with
  # LAN_IP) to the hardcoded LAN address, e.g. 192.168.1.10. HOSTNAMES ARE
  # BANNED (host.docker.internal, /etc/hosts tricks — never reintroduce): the
  # browser must reach the control plane over 127.0.0.1 / a LAN IP alone.
  # The gateway reaches the server over the compose network via its static
  # IP (GATEWAY_CONTROL_IP) and a loopback DERP relay — independent of this
  # value.
  CONTROL_HOST: ${CONTROL_HOST:-127.0.0.1}
  LAN_IP: ${LAN_IP:-127.0.0.1}
  SITE_PORT: ${SITE_PORT:-8081}
  CONTROL_PORT: ${CONTROL_PORT:-8443}
  CONTROL_WSS_PORT: ${CONTROL_WSS_PORT:-443}
  WEBDAV_PORT: ${WEBDAV_PORT:-8082}
  STUN_PORT: ${STUN_PORT:-3478}
  WEBDAV_ROOT: ${WEBDAV_ROOT:-/data/webdav}
  # The WebDAV URL base path (single home: scripts/lib/webvm-common.sh; the
  # entrypoint renders the wsgidav mount and the baked syncUrl from it).
  WEBDAV_BASE_PATH: ${WEBDAV_BASE_PATH:-/webdav/}
  WEBDAV_USER: ${WEBDAV_USER:-}
  WEBDAV_PASS: ${WEBDAV_PASS:-}
  HEADSCALE_PREAUTHKEY: ${HEADSCALE_PREAUTHKEY:-}
  GATEWAY_AUTHKEY: ${GATEWAY_AUTHKEY:-}
  GATEWAY_TAILNET_IP: ${GATEWAY_TAILNET_IP:-}

services:
  # nginx (site + control plane + DERP) + headscale (+ wsgidav in webdav mode)
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        STORAGE_BACKEND: ${STORAGE_BACKEND:-browser}
        WEBDAV_ROOT: ${WEBDAV_ROOT:-/data/webdav}
    restart: unless-stopped
    environment: *server-env
    # Surface container health (docker compose ps / `up --wait`). This does NOT
    # trigger restarts on its own — auto-recovery lives in the entrypoint
    # supervisor, which exits the container when headscale/wsgidav/nginx die so
    # `restart: unless-stopped` re-creates it. The healthcheck mirrors the
    # supervisor's MARKER mechanism (webvm_supervise_start writes
    # /tmp/webvm-nginx.status when the supervised nginx exits): `kill -0` on
    # nginx's own pidfile alone would lie about a crashed-but-zombie master
    # (PID 1 never reaps), so a marker file is the primary signal.
    healthcheck:
      test: ["CMD-SHELL", "if [ -f /tmp/webvm-nginx.status ]; then exit 1; fi; kill -0 $$(cat /var/run/nginx.pid 2>/dev/null) 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Cold first boot renders templates + waits for headscale's socket and
      # user namespace (up to ~60s) before nginx starts.
      start_period: 30s
    ports:
      # Ports are published ONLY on LAN_IP (never all interfaces). Default
      # 127.0.0.1 = zero-config single machine. LAN use sets LAN_IP=<lan-ip>.
      # The container side matches the rendered listen port so arbitrary
      # remapping works (nginx/wsgidav/headscale listen on the env value).
      # Site (HTTPS)
      - "${LAN_IP:-127.0.0.1}:${SITE_PORT:-8081}:${SITE_PORT:-8081}"
      # Control plane + embedded DERP (WSS)
      - "${LAN_IP:-127.0.0.1}:${CONTROL_PORT:-8443}:${CONTROL_PORT:-8443}"
      # WebDAV (webdav mode only; refused otherwise)
      - "${LAN_IP:-127.0.0.1}:${WEBDAV_PORT:-8082}:${WEBDAV_PORT:-8082}"
      # Embedded DERP STUN (UDP; used by the gateway over the compose network,
      # the host publish is a harmless extra)
      - "${LAN_IP:-127.0.0.1}:${STUN_PORT:-3478}:${STUN_PORT:-3478}/udp"
    volumes:
      - ./certs:/certs:ro
      # headscale's SQLite DB holds the preauth keys and the gateway's node
      # record (and therefore its allocated tailnet IP) — persistence is what
      # keeps GATEWAY_TAILNET_IP valid across container recreation.
      - headscale-data:/var/lib/headscale
      - ${DATA_DIR:-./data}:${WEBDAV_ROOT:-/data/webdav}
    networks:
      webvm-net:
        # The server's static compose-network IP — the ONLY address the
        # gateway/join-test client use for the control plane. The value is
        # interpolated from GATEWAY_CONTROL_IP (shared-lib default
        # 172.28.0.10) so an .env override reaches the actual interface —
        # a bare literal here would silently orphan a remapped gateway
        # (its --login-server follows the env var, the container stays on
        # the literal). The subnet (172.28.0.0/16) must cover the value.
        ipv4_address: ${GATEWAY_CONTROL_IP:-172.28.0.10}

  # tailscaled (userspace networking) + socat relays in one container.
  # Started only for tailnet modes: `make up-tailnet` (compose profile).
  gateway:
    build:
      # Repo-root context so the shared lib (scripts/lib/) can be COPY'd.
      context: .
      dockerfile: gateway/Dockerfile
    profiles: ["tailnet"]
    restart: unless-stopped
    # The default WSS port (443) is published HERE, on the tailnet profile
    # only: the CheerpX wasm client drops the controlUrl port when building
    # the /ts2021 Noise WebSocket URL (wss://<host>/ts2021), so the control
    # plane must also be reachable on the scheme-default WSS port. Browser/
    # none modes must never bind the privileged host port (it can conflict
    # with other HTTPS services and take the whole stack down at startup).
    ports:
      - "${LAN_IP:-127.0.0.1}:${CONTROL_WSS_PORT:-443}:443"
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-browser}
      GATEWAY_AUTHKEY: ${GATEWAY_AUTHKEY:-}
      # The gateway does NOT use CONTROL_HOST (browser-facing): its tailscaled
      # and relays talk to the control plane over the compose network at the
      # server's static IP (GATEWAY_CONTROL_IP — cert SAN covers it), and a
      # loopback relay makes the netmap's DERP host (127.0.0.1:CONTROL_PORT on
      # the single machine) reachable from inside this container. No hostnames
      # anywhere.
      GATEWAY_CONTROL_IP: ${GATEWAY_CONTROL_IP:-172.28.0.10}
      CONTROL_PORT: ${CONTROL_PORT:-8443}
      CONTROL_WSS_PORT: ${CONTROL_WSS_PORT:-443}
      WEBDAV_PORT: ${WEBDAV_PORT:-8082}
      SAMBA_LAN_IP: ${SAMBA_LAN_IP:-}
      GIT_SSH_LAN_IP: ${GIT_SSH_LAN_IP:-}
      GIT_SSH_PORT: ${GIT_SSH_PORT:-2222}
      GIT_HTTP_LAN_IP: ${GIT_HTTP_LAN_IP:-}
      GIT_HTTP_PORT: ${GIT_HTTP_PORT:-8083}
      # Trust the private CA for control-plane/DERP TLS (Go honors this)
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
      - gateway-state:/var/lib/tailscale
    depends_on:
      # Wait for the server to be HEALTHY (nginx serving — the entrypoint
      # brings nginx up only after headscale's socket/users/key checks), so
      # the gateway's un-retried `tailscale up` never races a cold start.
      server:
        condition: service_healthy
    networks:
      - webvm-net

  # Unit tests (pytest) — no host Python packages needed. openssl is the
  # gen-certs.sh SAN/coverage test's only external dependency.
  test-unit:
    image: python:3.14-alpine
    profiles: ["test"]
    working_dir: /work
    volumes:
      - .:/work
    command: sh -c "apk add --no-cache openssl >/dev/null 2>&1; pip install --no-cache-dir --break-system-packages pytest >/dev/null && pytest -q /work/tests/unit"

networks:
  webvm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  headscale-data:
  gateway-state:
