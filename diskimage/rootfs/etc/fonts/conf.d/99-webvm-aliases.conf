<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- WebVM font aliases: map the common proprietary/missing families that
     student Tk/Tcl code requests (consolas, arial, times new roman, ...) to the
     DejaVu families actually installed in the guest. fontconfig would usually
     substitute these anyway, but an EXPLICIT alias makes the resolution
     deterministic (no reliance on the generic unknown-family fallback) and
     keeps the same visual class: mono -> DejaVu Sans Mono, sans -> DejaVu
     Sans, serif -> DejaVu Serif. -->
<fontconfig>
  <alias>
    <family>consolas</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>courier</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>courier new</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>monaco</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>menlo</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>lucida console</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>arial</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>helvetica</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>verdana</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>tahoma</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>calibri</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>segoe ui</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>ms sans serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>times</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>times new roman</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>georgia</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>garamond</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>palatino</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
</fontconfig>
