# CheerpX virtual DRM: the modesetting driver cannot enumerate KMS planes
# (EINVAL on GETPLANERESOURCES) and glamor fails, so force the software
# shadow-framebuffer + legacy copy presentation path (no page flips).
Section "Device"
	Identifier "Card0"
	Driver "modesetting"
	Option "ShadowFB" "true"
	Option "AccelMethod" "none"
	Option "PageFlip" "false"
EndSection
