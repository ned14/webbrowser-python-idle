# Static input device configuration for the CheerpX guest (Tier B).
#
# Xorg's udev input backend cannot enumerate devices under CheerpX: the
# emulated sysfs is too shallow for libudev (no /sys/devices/... paths, no
# device/name attributes), so even with udevd alive Xorg's config/udev
# backend finds ZERO input devices — the cursor never moves and clicks never
# dispatch (diagnosed 2026-08-20; plans/update-to-latest.md Tier B §9.2).
#
# The CheerpX runtime creates the input nodes itself (/dev/input/event0 =
# the emulated i8042 PS/2 mouse, event1 = keyboard) and evdev ioctls on
# them work (EVIOCGNAME/EVIOCGBIT verified in-guest). So input is attached
# the pre-udev way: AutoAddDevices off + explicit evdev InputDevice sections
# with the raw device paths.
#
# NOTE: this also fixes the page-side pointer for the whole desktop — the
# same path that broke the explorer's double-click dispatch.

Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AllowEmptyInitialConfiguration" "true"
EndSection

Section "InputDevice"
	Identifier "CheerpXMouse"
	Driver "evdev"
	Option "Device" "/dev/input/event0"
	Option "CorePointer" "on"
EndSection

Section "InputDevice"
	Identifier "CheerpXKeyboard"
	Driver "evdev"
	Option "Device" "/dev/input/event1"
	Option "CoreKeyboard" "on"
EndSection

Section "ServerLayout"
	Identifier "CheerpXLayout"
	InputDevice "CheerpXMouse" "CorePointer"
	InputDevice "CheerpXKeyboard" "CoreKeyboard"
EndSection
