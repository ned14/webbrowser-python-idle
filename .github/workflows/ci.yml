name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guest-image:
    name: Guest image + ext2 (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [browser, samba, webdav, none]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Optional belt-and-braces: i386 runs natively on the amd64 runner
      # (x86-64 hardware compat mode), so QEMU is not required.
      - uses: docker/setup-qemu-action@v3
      - name: Build guest + ext2
        run: ./build.sh ${{ matrix.backend }}
      - name: Verify ext2 (ownership + key paths)
        run: |
          docker run --rm -v "$PWD":/work webvm-ext2-helper sh -c '
            debugfs -R "stat /sbin/init" /work/webvm/custom-disk-images/webvm-custom-disk.ext2 >/dev/null || exit 1
            debugfs -R "stat /usr/bin/idle3.10" /work/webvm/custom-disk-images/webvm-custom-disk.ext2 >/dev/null || exit 1
            debugfs -R "stat /home/user/.config/i3/config" /work/webvm/custom-disk-images/webvm-custom-disk.ext2 >/dev/null || exit 1
            debugfs -R "stat /home/user" /work/webvm/custom-disk-images/webvm-custom-disk.ext2 2>/dev/null | grep -Eq "User:[[:space:]]+1000" || exit 1
          '
      - name: Rootfs smoke
        run: tests/rootfs/smoke.sh ${{ matrix.backend }}
      - name: Upload ext2 + fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: guest-${{ matrix.backend }}
          path: webvm/custom-disk-images/

  frontend:
    name: Frontend build (${{ matrix.backend }})
    runs-on: ubuntu-latest
    needs: guest-image
    strategy:
      fail-fast: false
      matrix:
        backend: [browser, samba, webdav, none]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webvm/package-lock.json
      - name: Download guest fingerprint
        uses: actions/download-artifact@v4
        with:
          name: guest-${{ matrix.backend }}
          path: guest-artifact
      - name: Export guest fingerprint to the build
        # The download step placed the artifact at guest-artifact/ in the
        # workspace root; this step runs there too, so the path is relative.
        run: echo "WEBVM_IMAGE_BUILD=$(cat guest-artifact/image-build.txt)" >> "$GITHUB_ENV"
      - name: npm ci (committed lockfile, pinned cheerpx 1.3.7)
        working-directory: webvm
        run: npm ci --no-audit --no-fund
      - name: Build frontend with matching cacheId fingerprint
        working-directory: webvm
        env:
          WEBVM_MODE: ${{ matrix.backend }}
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.backend }}
          path: webvm/build/

  server:
    name: Server integration + E2E (webdav)
    runs-on: ubuntu-latest
    needs: [guest-image, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Download webdav guest ext2 + frontend
        uses: actions/download-artifact@v4
        with:
          name: guest-webdav
          path: webvm/custom-disk-images/
      - uses: actions/download-artifact@v4
        with:
          name: frontend-webdav
          path: webvm/build/

      - name: Generate throwaway private CA + cert
        run: ./scripts/gen-certs.sh

      - name: Deployment .env (loopback-safe CI defaults)
        run: |
          cat > .env <<EOF
          CONTROL_HOST=host.docker.internal
          LAN_IP=127.0.0.1
          EXTRA_BIND_IP=127.0.0.2
          STORAGE_BACKEND=webdav
          WEBDAV_USER=webdav
          WEBDAV_PASS=webdavpass
          HEADSCALE_BOOTSTRAP=1
          EOF
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Build images
        run: docker compose build

      - name: Bootstrap preauth keys (first run of headscale)
        run: |
          docker compose up -d server
          for i in $(seq 1 30); do
            docker compose exec -T server sh -c 'test -S /var/run/headscale/headscale.sock' 2>/dev/null && break
            sleep 2
          done
          # v0.29.x: --user takes the NUMERIC user id (headscale users list);
          # the entrypoint creates the 'headscale' namespace first (id 1).
          KEY1=$(docker compose exec -T server headscale preauthkeys create --user 1 --reusable --expiration 100y | sed -E 's/\x1b\[[0-9;]*m//g' | tail -1)
          KEY2=$(docker compose exec -T server headscale preauthkeys create --user 1 --reusable --expiration 100y | sed -E 's/\x1b\[[0-9;]*m//g' | tail -1)
          printf 'HEADSCALE_PREAUTHKEY=%s\nGATEWAY_AUTHKEY=%s\nHEADSCALE_BOOTSTRAP=0\n' "$KEY1" "$KEY2" >> .env
          docker compose up -d server

      - name: Bring up tailnet stack (gateway)
        run: docker compose --profile tailnet up -d

      - name: Wait for the gateway to join
        run: |
          joined=0
          for i in $(seq 1 30); do
            if docker compose exec -T server headscale nodes list | grep -q gateway; then
              joined=1
              break
            fi
            sleep 5
          done
          [ "$joined" = "1" ] || { echo "FAIL: the gateway did not join the tailnet" >&2; exit 1; }
          docker compose exec -T server headscale nodes list

      - name: Server integration tests
        run: |
          set -a; . ./.env; set +a
          STORAGE_BACKEND=webdav WEBDAV_USER=webdav WEBDAV_PASS=webdavpass \
            tests/server/integration.sh

      - name: Install Playwright + browsers
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E (browser + webdav)
        working-directory: tests/e2e
        run: |
          GATEWAY_IP=$(docker compose exec -T gateway tailscale ip -4 2>/dev/null | head -1)
          echo "gateway tailnet IP: $GATEWAY_IP"
          E2E_SITE_URL="https://127.0.0.1:8081/alpine.html" \
          E2E_WEBDAV_URL="https://host.docker.internal:8081/alpine.html#authKey=$(grep '^HEADSCALE_PREAUTHKEY=' ../../.env | cut -d= -f2)&controlUrl=https://host.docker.internal:8443&syncUrl=http://${GATEWAY_IP}:8082/webdav/&syncUser=webdav&syncPass=webdavpass" \
          E2E_WEBDAV_BASE="http://127.0.0.1:8082/webdav/" \
          E2E_WEBDAV_USER=webdav E2E_WEBDAV_PASS=webdavpass \
          npx playwright test

      - name: Tear down
        if: always()
        run: docker compose --profile tailnet down -v --remove-orphans

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD":/work -w /work koalaman/shellcheck:stable -S warning \
            build.sh server/entrypoint.sh gateway/entrypoint.sh \
            scripts/gen-certs.sh scripts/print-url.sh scripts/acceptance.sh \
            scripts/fetch-cheerpx-runtime.sh \
            diskimage/sync/sync-home.sh diskimage/rootfs/etc/local.d/desktop.start \
            diskimage/scripts/99-screen-resize.sh tests/rootfs/smoke.sh \
            tests/server/integration.sh tests/server/join-test-client.sh
      - name: yamllint
        run: |
          docker run --rm -v "$PWD":/work -w /work cytopia/yamllint:latest \
            -c /work/.yamllint /work/compose.yaml /work/.github/workflows/ci.yml
